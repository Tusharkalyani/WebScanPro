version: '3.8'

services:
  webscanpro:
    build: .
    container_name: webscanpro_scanner
    ports:
      - "5001:5001"
    environment:
      - SECRET_KEY=webscanpro-cyber-suite-production-key
      - DATABASE_URL=sqlite:///instance/webscanpro.db
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped

  # Optional local training target for security assessment verification
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: webscanpro_target_juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped
